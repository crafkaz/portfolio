services:
  app:
    build: .
    volumes:
      - .:/app
      - bun_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: ["sh", "-c", "bun install --frozen-lockfile && exec bun run dev"]

  e2e:
    profiles: [test]
    build:
      context: .
      dockerfile: test/e2e/Dockerfile
    init: true

volumes:
  bun_node_modules:
